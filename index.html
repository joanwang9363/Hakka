        /* 按鈕點擊與動畫 */
        .option-btn {
            transition: all 0.2s ease;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }
        .option-btn:active:not(:disabled) {
            transform: scale(0.95);
        }
        .option-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        /* 答錯時的左右搖晃動畫 */
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            50% { transform: translateX(5px); }
            75% { transform: translateX(-5px); }
        }
        .animate-shake {
            animation: shake 0.4s;
        }

        /* 彈出視窗 Q彈動畫 */
        @keyframes popIn {
            0% { transform: scale(0.8); opacity: 0; }
            60% { transform: scale(1.05); opacity: 1; }
            100% { transform: scale(1); opacity: 1; }
        }
        .animate-pop {
            animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        /* 對話框小尾巴 */
        .joan-bubble {
            position: relative;
        }
        .joan-bubble::after {
            content: '';
            position: absolute;
            bottom: -10px;
            left: 50px;
            border-width: 10px 10px 0;
            border-style: solid;
            border-color: #fbcfe8 transparent transparent transparent;

        // 載入題目
        function loadQuestion() {
            const currentQ = shuffledQuestions[currentQuestionIndex];
            
            // 設定題目文字
            document.getElementById('question-text').innerText = currentQ.qText;
            document.getElementById('question-hint').innerText = currentQ.qHint;
            
            // 恢復JOAN的預設問候語
            document.getElementById('joan-msg').innerText = "這句客家話的下半句是什麼呢？";
            document.getElementById('joan-msg').className = "text-xl font-medium mt-1 block text-slate-700";

            // 準備選項 (正確1個 + 錯誤2個)
            let options = [
                { text: currentQ.aText, hint: currentQ.aHint, isCorrect: true },
                ...currentQ.wrongOptions.map(opt => ({ ...opt, isCorrect: false }))
            ];
            
            // 打亂選項順序
            options.sort(() => Math.random() - 0.5);

            // 生成按鈕
            const container = document.getElementById('options-container');
            container.innerHTML = ''; // 清空舊按鈕
            
            options.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = 'option-btn w-full bg-white border-4 border-blue-100 hover:bg-blue-50 text-left px-6 py-5 rounded-2xl flex flex-col md:flex-row md:items-end gap-2 group';
                
                btn.innerHTML = `
                    <span class="text-3xl font-bold text-slate-800 group-hover:text-blue-700">${opt.text}</span>
                    <span class="text-lg text-slate-500 font-medium">${opt.hint}</span>
                `;
                
                btn.onclick = () => checkAnswer(btn, opt.isCorrect, currentQ);
                container.appendChild(btn);
            });
        }

        // 檢查答案
        function checkAnswer(buttonElement, isCorrect, questionData) {
            if (isCorrect) {
                // 答對了
                buttonElement.classList.remove('bg-white', 'border-blue-100', 'hover:bg-blue-50');
                buttonElement.classList.add('bg-green-100', 'border-green-400');
                
                // 更新JOAN的碎碎念
                document.getElementById('joan-msg').innerText = questionData.joanMsg;
                document.getElementById('joan-msg').className = "text-xl font-bold mt-1 block text-pink-700";

                showVictoryModal(questionData);
            } else {
                // 答錯了
                buttonElement.classList.remove('bg-white', 'hover:bg-blue-50');
                buttonElement.classList.add('bg-slate-200', 'border-slate-300', 'opacity-50');
                buttonElement.disabled = true; // 鎖住按錯的按鈕
                
                // 搖晃動畫
                buttonElement.classList.remove('animate-shake');
                void buttonElement.offsetWidth; // 觸發重繪
                buttonElement.classList.add('animate-shake');

                // JOAN 給予鼓勵
                document.getElementById('joan-msg').innerText = "哎呀！差一點點，再猜猜看別的！";
                document.getElementById('joan-msg').className = "text-xl font-bold mt-1 block text-slate-600";
            }
        }

        // 顯示過關視窗
        function showVictoryModal(questionData) {
            const modal = document.getElementById('victory-modal');
            
            // 設定視窗內容
            document.getElementById('modal-full-slang').innerText = `${questionData.qText} ${questionData.aText}`;
            document.getElementById('modal-explanation').innerText = questionData.joanMsg;

            modal.classList.remove('hidden');
            
            // Q彈動畫
            const modalBox = modal.querySelector('.bg-white');
            modalBox.classList.remove('animate-pop');
            void modalBox.offsetWidth;
            modalBox.classList.add('animate-pop');

            // 觸發彩帶
            fireConfetti();
        }

        // 下一題
        function nextQuestion() {
            document.getElementById('victory-modal').classList.add('hidden');
            
            currentQuestionIndex++;
            
            // 如果題目做完了，就重新洗牌重來
            if (currentQuestionIndex >= shuffledQuestions.length) {
                currentQuestionIndex = 0;
                shuffledQuestions = [...slangs].sort(() => Math.random() - 0.5);
                document.getElementById('joan-msg').innerText = "太厲害了！全部都答對了，我們再來複習一次！";
            }
            
            loadQuestion();
        }

        // 彩帶動畫
        function fireConfetti() {
            var duration = 2 * 1000;
            var animationEnd = Date.now() + duration;
            var defaults = { startVelocity: 30, spread: 360, ticks: 60, zIndex: 2000 };

            function randomInRange(min, max) { return Math.random() * (max - min) + min; }

            var interval = setInterval(function() {
                var timeLeft = animationEnd - Date.now();
                if (timeLeft <= 0) { return clearInterval(interval); }
                var particleCount = 50 * (timeLeft / duration);
                
                confetti(Object.assign({}, defaults, { 
                    particleCount, origin: { x: randomInRange(0.1, 0.3), y: Math.random() - 0.2 }
                }));
                confetti(Object.assign({}, defaults, { 
                    particleCount, origin: { x: randomInRange(0.7, 0.9), y: Math.random() - 0.2 }
                }));
            }, 250);
        }

        // 啟動遊戲
        window.onload = initGame;
    </script>
</body>
</html>
